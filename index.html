        return acc.concat(g.map(function (p) { var d = decorate(p); d.isRow = true; d.isHeader = false; return d; }));
      }, []),
      hasMore: s.view === 'cards' && list.length > s.limit,
      restN: Math.max(0, list.length - s.limit),
      showMore: function () { self.setState({ limit: self.state.limit + 12 }); },
      fmtLabel: fmtNames[fmt], fmtShort: fmtShortN[fmt],
      reachLabel: reachL[fmt],
      thS: fmt === 's' ? 'color:#E9CFA0' : '', thP: fmt === 'p' ? 'color:#E9CFA0' : '', thW: fmt === 'w' ? 'color:#E9CFA0' : '',
      hasSel: selN > 0,
      selCountLabel: selN + ' ' + plural(selN, 'позиция', 'позиции', 'позиций'),
      selReach: selKnown.length ? short(selKnown.reduce(function (a, p) { return a + reachOf(p); }, 0)) : '—',
      selSum: rub(selItems.reduce(function (a, x) { return a + x.p.price[x.f]; }, 0)),
      copied: !!s.copied,
      sendSel: copySel, selHref: selHref,
      clearSel: function () { self.setState({ sel: {} }); }
    };
  }
}

var TPL = document.getElementById('tpl');
var ROOT = document.getElementById('app');
var comp = new Component({});
var pending = false;
function scheduleRender() { if (pending) return; pending = true; setTimeout(function () { pending = false; render(); }, 0); }

function lookup(path, scope) {
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  var parts = path.split('.'), v = scope;
  for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
  return v;
}
var WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function interp(str, scope) {
  return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
}
function child(scope, k, v, i) { var s = Object.create(scope); s[k] = v; s.$index = i; return s; }

function build(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  var tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    var m = WHOLE.exec(node.getAttribute('list') || ''); var list = m ? lookup(m[1], scope) : [];
    var as = node.getAttribute('as') || 'item';
    (list || []).forEach(function (it, i) { var s = child(scope, as, it, i); node.childNodes.forEach(function (c) { build(c, s, out); }); });
    return;
  }
  if (tag === 'sc-if') {
    var m2 = WHOLE.exec(node.getAttribute('value') || '');
    if (m2 && lookup(m2[1], scope)) node.childNodes.forEach(function (c) { build(c, scope, out); });
    return;
  }
  var el = node.namespaceURI === 'http://www.w3.org/1999/xhtml' ? document.createElement(node.localName) : document.createElementNS(node.namespaceURI, node.localName);
  var deferredValue;
  Array.prototype.forEach.call(node.attributes, function (a) {
    var name = a.name, val = a.value;
    if (name.indexOf('hint-') === 0) return;
    var w = WHOLE.exec(val);
    if (name.indexOf('on') === 0 && w) {
      var fn = lookup(w[1], scope); if (typeof fn !== 'function') return;
      var ev = name.slice(2);
      if (ev === 'change' && (tag === 'input' || tag === 'textarea')) ev = 'input';
      el.addEventListener(ev, fn); return;
    }
    if (name === 'value' && (tag === 'input' || tag === 'select')) { deferredValue = w ? lookup(w[1], scope) : val; return; }
    var v = w ? lookup(w[1], scope) : interp(val, scope);
    if (v === false || v == null) return;
    el.setAttribute(name, v === true ? '' : String(v));
  });
  var kids = node.tagName === 'TEMPLATE' ? node.content.childNodes : node.childNodes;
  Array.prototype.forEach.call(kids, function (c) { build(c, scope, el); });
  if (deferredValue !== undefined) el.value = deferredValue == null ? '' : deferredValue;
  out.appendChild(el);
}

function render() {
  var a = document.activeElement, focusKey = null, selS, selE;
  if (a && a.tagName === 'INPUT') { focusKey = a.getAttribute('placeholder'); selS = a.selectionStart; selE = a.selectionEnd; }
  var vals = comp.renderVals();
  var frag = document.createDocumentFragment();
  TPL.content.childNodes.forEach(function (c) { build(c, vals, frag); });
  ROOT.replaceChildren(frag);
  if (focusKey) { var i = ROOT.querySelector('input[placeholder="' + focusKey + '"]'); if (i) { i.focus(); try { i.setSelectionRange(selS, selE); } catch (e) {} } }
}
render();

window.render = render;

(function () {
  var W = window.Telegram && window.Telegram.WebApp;
  if (!W || !W.initData) return;            // обычный браузер: сайт работает как раньше
  document.documentElement.classList.add('tg');
  var BG = '#0B0B0C', GOLD = '#E9CFA0', INK = '#141414';
  var v = function (x) { return W.isVersionAtLeast && W.isVersionAtLeast(x); };
  try { W.ready(); W.expand(); } catch (e) {}
  try { if (v('6.1')) { W.setHeaderColor(BG); W.setBackgroundColor(BG); } } catch (e) {}
  try { if (v('7.10')) W.setBottomBarColor(BG); } catch (e) {}
  try { if (v('7.7')) W.disableVerticalSwipes(); } catch (e) {}
  var hap = function (t) { try { if (v('6.1')) { t === 'sel' ? W.HapticFeedback.selectionChanged() : W.HapticFeedback.notificationOccurred(t); } } catch (e) {} };

  var MB = W.MainButton, SB = v('7.10') ? W.SecondaryButton : null, cur = null, shown = false;
  var sendNow = function () {
    if (!cur || !cur.count) return;
    cur.send(); hap('success');
    var href = cur.href;
    setTimeout(function () { try { W.openTelegramLink(href); } catch (e) { location.href = href; } }, 250);
  };
  var clearNow = function () { if (cur) { cur.clear(); hap('warning'); } };
  MB.onClick(sendNow);
  if (SB) SB.onClick(clearNow);

  window.__tmSel = function (st) {
    cur = st;
    // откладываем: хук вызывается во время рендера
    setTimeout(function () {
      if (st.count) {
        var p = { text: 'Отправить менеджеру · ' + st.sum.replace(/ /g, ' '), color: GOLD, text_color: INK, is_active: true, is_visible: true };
        if (v('7.10')) p.has_shine_effect = !shown;
        MB.setParams(p);
        if (SB) SB.setParams({ text: 'Очистить', color: '#1C1B19', text_color: '#D8D3CA', position: 'left', is_visible: true, is_active: true });
        shown = true;
      } else {
        MB.hide(); if (SB) SB.hide(); shown = false;
      }
    }, 0);
  };
  if (window.render) window.render();

  // ссылки: Telegram — внутри Telegram, Instagram и прочие — во внешнем браузере
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (a) {
      var h = a.getAttribute('href');
      if (/^https?:\/\/t\.me\//i.test(h)) { e.preventDefault(); W.openTelegramLink(h); return; }
      if (/^https?:\/\//i.test(h)) { e.preventDefault(); W.openLink(h); return; }
      return;
    }
    var b = e.target.closest && e.target.closest('button[aria-pressed]');
    if (b && b.getAttribute('aria-disabled') !== 'true') hap('sel');
  }, true);

  // кнопка «Назад» — наверх страницы
  var BB = v('6.1') ? W.BackButton : null;
  if (BB) {
    BB.onClick(function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    var upd = function () { (window.scrollY > 700) ? BB.show() : BB.hide(); };
    window.addEventListener('scroll', upd, { passive: true }); upd();
  }
})();
</script>
